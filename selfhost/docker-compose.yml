# TBD · MiSemana — servidor de sincronización autoalojado.
# Guía completa: docs/AUTOALOJADO.md
#   cp .env.example .env      (y completar MONGODB_URI)
#   docker compose up -d
#   docker compose exec servidor node manage.js add <nombre>
name: tbd

services:
  servidor:
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:?Falta MONGODB_URI en selfhost/.env}
      MONGODB_DB: ${MONGODB_DB:-tbd}
      PORT: "8787"
    ports:
      - "${TBD_PORT:-8787}:8787"

  # Opcional: HTTPS automático con un dominio propio (docker compose --profile https up -d).
  https:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      TBD_DOMAIN: ${TBD_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
    depends_on:
      - servidor

volumes:
  caddy-datos:
